<!DOCTYPE html>
<html lang="en">
<head>
    <title>EVM auth</title>
    <script type="module">
        import {ethers} from "/webjars/ethers/6.13.1/dist/ethers.min.js";

        const myAddress = "{{address}}";
        const messages = [
            {{messages}}
        ];

        async function signIt(ethereum) {
            const provider = new ethers.BrowserProvider(ethereum)
            await provider.send("eth_requestAccounts", []);
            const signer = await provider.getSigner();
            const signerAddress = await signer.getAddress();
            if (myAddress.toUpperCase() !== signerAddress.toUpperCase()) {
                throw new Error(`Wrong address, expected ${myAddress} but was ${signerAddress}`);
            }
            const signatures = [];
            for (const message of messages) {
                const rawSignature = await signer.signMessage(message);
                signatures.push(ethers.Signature.from(rawSignature).toJSON());
            }
            await fetch("/signatures", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(signatures)
            });
        }

        try {
            if (window.ethereum == null) {
                throw new Error("No EVM wallet found");
            } else {
                await signIt(window.ethereum);
            }
        } catch (err) {
            await fetch("/error", {
                method: "POST",
                body: err.message
            });
        }
        window.close();
    </script>
</head>
<body>
</body>
</html>
